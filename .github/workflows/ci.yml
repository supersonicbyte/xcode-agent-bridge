name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26 (Swift 6.2)
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          swift --version

      - name: Test
        run: swift test

      - name: Build the app
        env:
          CODESIGN_IDENTITY: "-"
          UNIVERSAL: "1"
        run: scripts/build-app.sh

      - name: Check the app bundle
        run: |
          APP="build/Xcode Agent Bridge.app"
          lipo -archs "$APP/Contents/MacOS/XcodeAgentBridge"
          plutil -lint "$APP/Contents/Info.plist"
          codesign --verify --verbose "$APP"
