name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26 (Swift 6.2)
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          swift --version

      - name: Test
        run: swift test

      - name: Build the app
        env:
          CODESIGN_IDENTITY: "-"
          UNIVERSAL: "1"
          BUILD_NUMBER: ${{ github.run_number }}
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/build-app.sh

      - name: Zip
        run: |
          ZIP="XcodeAgentBridge-${GITHUB_REF_NAME}.zip"
          ditto -c -k --keepParent "build/Xcode Agent Bridge.app" "$ZIP"
          shasum -a 256 "$ZIP" | tee "$ZIP.sha256"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          ## Install

          1. Download \`$ZIP\`, unzip it, and move **Xcode Agent Bridge.app** to Applications.
          2. The app isn't notarized yet, so macOS blocks the first launch. Either right-click the app and choose **Open**, or run:
             \`\`\`sh
             xattr -dr com.apple.quarantine "/Applications/Xcode Agent Bridge.app"
             \`\`\`
          3. Allow Accessibility access when asked (System Settings ▸ Privacy & Security ▸ Accessibility).

          Requires macOS 15 or later and \`claude\` (Claude Code) or \`codex\` installed. Runs on Apple silicon and Intel.

          Because this build is signed ad hoc, macOS asks for Accessibility access again after each update. Building from source with your own Apple Development certificate avoids that (see the README).
          NOTES
          gh release create "$GITHUB_REF_NAME" "$ZIP" "$ZIP.sha256" \
            --title "Xcode Agent Bridge ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --generate-notes
